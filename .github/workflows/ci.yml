name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  INSPIRE_RUN_LIVE: '0'
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOENV: 'off'
  GOPATH: ${{ github.workspace }}/tmp/gopath
  GOMODCACHE: ${{ github.workspace }}/tmp/gomodcache
  GOCACHE: ${{ github.workspace }}/tmp/gocache
  GOTMPDIR: ${{ github.workspace }}/tmp/gotmp
  TEST_TELEMETRY_DIR: ${{ github.workspace }}/tmp/telemetry

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.23.x', stable]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare local Go directories
        run: |
          New-Item -ItemType Directory -Path tmp/gopath,tmp/gomodcache,tmp/gocache,tmp/gotmp,tmp/telemetry -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $env:TEST_TELEMETRY_DIR 'mode'), 'off')
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Verify modules
        run: ./tools/go.ps1 mod verify
      - name: Check formatting
        run: |
          ./tools/go.ps1 fmt ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- .
      - name: Test
        run: ./tools/go.ps1 test -count=1 ./... -timeout 120s
      - name: Race detector
        run: ./tools/go.ps1 test -race -count=1 ./... -timeout 180s
      - name: Vet
        run: ./tools/go.ps1 vet ./...
      - name: Build
        run: ./tools/go.ps1 build ./...
      - name: Validate plugin and skill
        run: ./tools/go.ps1 run ./tools/checkskill
